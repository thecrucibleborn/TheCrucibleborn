<!DOCTYPE html>
<html lang="en">
<head>

  <title>404 | The Crucibleborn</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#99FFFF">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    body {
      background-color: #99FFFF;
      font-family: "Times New Roman", Times, serif;
      color: #111111;
      padding: 20px;

    .container {
      max-width: 640px;
      margin: 0 auto;

      text-align: center;
    }

    h1 {
      font-family: "Almendra Display", serif;
      font-size: 3em;
      letter-spacing: 0.04em;
      margin: 10px 0 4px 0;
    }

    .divider {
      font-size: 0.85em;
      padding: 10px 0;
      letter-spacing: 0.05em;
      user-select: none;
    }

    p {
      font-size: 0.9em;
      line-height: 1.75;
      margin-bottom: 10px;
    }

    a {
      color: #555555;
      background-color: #ffffff;
      text-decoration: underline;
    }

    a:hover {
      color: #ffffff;
      background-color: #111111;
      text-decoration: none;
    }

    .lost-art {
      display: block;
      margin: 14px auto;
      max-width: 100%;
      height: auto;
    }

</head>
